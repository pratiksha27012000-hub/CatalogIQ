<svg xmlns="http://www.w3.org/2000/svg" width="2048" height="1203" viewBox="0 0 2048 1203" role="img" aria-labelledby="title desc">
<title id="title">CatalogIQ architecture overview — prototype</title>
<desc id="desc">A three-stage architecture diagram. Catalogue preparation uploads and maps source data, stores canonical records and extracts attributes. The data and retrieval layer uses Sentence Transformers, a per-catalogue FAISS index, and DuckDB as the source of truth. Questions enter through a Gradio dashboard, pass through a query router and interpreter, then follow structured, hybrid or semantic retrieval paths. An answer generator returns exact, hybrid-verified or candidate-labelled responses.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#071426"/><stop offset="0.55" stop-color="#080f1e"/><stop offset="1" stop-color="#17112c"/></linearGradient>
  <linearGradient id="logo" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3e86f6"/><stop offset="1" stop-color="#8755f2"/></linearGradient>
  <linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#152238"/><stop offset="1" stop-color="#0e1728"/></linearGradient>
  <radialGradient id="glowBlue"><stop offset="0" stop-color="#1557a4" stop-opacity=".25"/><stop offset="1" stop-color="#1557a4" stop-opacity="0"/></radialGradient>
  <radialGradient id="glowPurple"><stop offset="0" stop-color="#5b2c9c" stop-opacity=".22"/><stop offset="1" stop-color="#5b2c9c" stop-opacity="0"/></radialGradient>
  <pattern id="dots" width="42" height="42" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.5" fill="#25436c" opacity=".55"/></pattern>
  <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#8195b6"/></marker>
  <marker id="arrowCyan" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#20d9f2"/></marker>
  <style>
    text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
    .title{font-size:54px;font-weight:850;letter-spacing:-2px;fill:#edf3ff}
    .subtitle{font-size:20px;fill:#a8b7d0}
    .eyebrow{font-size:16px;font-weight:800;letter-spacing:2.1px}
    .cardTitle{font-size:23px;font-weight:760;fill:#e5ecfa}
    .cardBody{font-size:16px;fill:#92a2bc}
    .small{font-size:14px;fill:#91a2bd}
    .nodeTitle{font-size:19px;font-weight:760;fill:#e4ecfb}
    .nodeBody{font-size:15px;fill:#91a2bb}
    .label{font-size:14px;font-weight:700;letter-spacing:1.7px;fill:#7f93b3}
    .white{fill:#ecf3ff}
    .cyan{fill:#23d9f1}.green{fill:#24d47a}.blue{fill:#438bff}.purple{fill:#9b65ff}.orange{fill:#ffa600}
    .box{fill:url(#card);stroke-width:1.7}
    .line{fill:none;stroke:#8195b6;stroke-width:2.1;marker-end:url(#arrow)}
    .dataLine{fill:none;stroke:#20d9f2;stroke-width:2;stroke-dasharray:5 7;marker-end:url(#arrowCyan)}
  </style>
</defs>

<!-- Background -->
<rect width="2048" height="1203" fill="url(#bg)"/>
<rect width="2048" height="1203" fill="url(#dots)"/>
<ellipse cx="230" cy="250" rx="650" ry="480" fill="url(#glowBlue)"/>
<ellipse cx="1770" cy="220" rx="560" ry="470" fill="url(#glowPurple)"/>

