<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1260" viewBox="0 0 1600 1260" role="img" aria-labelledby="title desc">
  <title id="title">CatalogIQ system architecture</title>
  <desc id="desc">CatalogIQ architecture from file ingestion through normalization, Gemini attribute enrichment, DuckDB storage, Sentence Transformer and FAISS indexing, question routing into structured, hybrid or semantic retrieval, and grounded answers in a three-panel Gradio dashboard.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#08111f"/><stop offset="1" stop-color="#111b31"/></linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#286be6"/><stop offset="1" stop-color="#5546c8"/></linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#087e8b"/><stop offset="1" stop-color="#1b9b87"/></linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6546b8"/><stop offset="1" stop-color="#8d4db5"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#000" flood-opacity=".23"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1 1 L10 6 L1 11" fill="none" stroke="#91a7ca" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <style>
      .h{font:700 34px Inter,Arial,sans-serif;fill:#eef4ff}.sub{font:400 17px Inter,Arial,sans-serif;fill:#9fb1cf}.small{font:700 14px Inter,Arial,sans-serif;fill:#80a0ce;letter-spacing:1.15px}.title{font:700 20px Inter,Arial,sans-serif;fill:#f4f7ff}.body{font:400 15px Inter,Arial,sans-serif;fill:#bfd0e8}.note{font:400 13px Inter,Arial,sans-serif;fill:#91a6c7}.box{fill:#121f35;stroke:#314767;stroke-width:2;rx:17;filter:url(#shadow)}.box2{fill:#101b2d;stroke:#2b405f;stroke-width:2;rx:16}.arrow{stroke:#91a7ca;stroke-width:2.4;fill:none;marker-end:url(#arrow)}.dashed{stroke-dasharray:7 7}
    </style>
  </defs>
  <rect width="1600" height="1260" fill="url(#bg)"/>
  <text x="70" y="70" class="h">CatalogIQ · System Architecture</text>
  <text x="70" y="105" class="sub">From heterogeneous product catalogues to evidence-grounded natural-language answers</text>

  <!-- 1. INGESTION -->
  <text x="70" y="160" class="small">1 · CATALOGUE INGESTION &amp; NORMALISATION</text>
  <rect x="70" y="185" width="300" height="125" class="box"/>
  <text x="98" y="228" class="title">Source catalogue</text>
  <text x="98" y="260" class="body">CSV · Excel · JSON</text>
  <text x="98" y="285" class="body">Product rows and source fields</text>
  <rect x="475" y="185" width="360" height="125" class="box"/>
  <text x="503" y="228" class="title">Validation &amp; column mapping</text>
  <text x="503" y="260" class="body">Preview · validate · map fields</text>
  <text x="503" y="285" class="body">Review before catalogue registration</text>
  <rect x="940" y="185" width="590" height="125" class="box"/>
  <text x="968" y="228" class="title">Canonical records + original source metadata</text>
  <text x="968" y="260" class="body">Five stable fields: title · description · selling price</text>
  <text x="968" y="285" class="body">cost price · inventory quantity + retained source payload</text>
  <path d="M370 247 H465" class="arrow"/><path d="M835 247 H930" class="arrow"/>

  <!-- 2. DATA SERVICES -->
  <text x="70" y="365" class="small">2 · ENRICHMENT, STORAGE &amp; INDEXING</text>
  <rect x="70" y="395" width="405" height="155" class="box"/>
  <text x="98" y="439" class="title">Gemini attribute extraction</text>
  <text x="98" y="472" class="body">Discover product-specific attributes</text>
  <text x="98" y="499" class="body">Validate values against source evidence</text>
  <text x="98" y="526" class="body">Retain attribute names, values and evidence</text>
  <rect x="595" y="395" width="410" height="155" rx="17" fill="url(#teal)" filter="url(#shadow)"/>
  <text x="623" y="439" class="title">DuckDB catalogue store</text>
  <text x="623" y="472" class="body">Catalogue registry and product records</text>
  <text x="623" y="499" class="body">Related extracted attributes + evidence</text>
  <text x="623" y="526" class="body">Source of truth for supported exact counts</text>
  <rect x="1125" y="395" width="405" height="155" class="box"/>
  <text x="1153" y="439" class="title">Semantic index per catalogue</text>
  <text x="1153" y="472" class="body">Sentence Transformer embeddings</text>
  <text x="1153" y="499" class="body">FAISS CPU vector index</text>
  <text x="1153" y="526" class="body">Scoped to the selected catalogue ID</text>
  <path d="M1235 310 V350 H270 V385" class="arrow"/>
  <path d="M1235 310 V350 H800 V385" class="arrow"/>
  <path d="M1235 310 V350 H1325 V385" class="arrow"/>
  <path d="M475 472 H585" class="arrow"/>
  <path d="M1005 472 H1115" class="arrow"/>

  <!-- 3. ROUTING -->
  <text x="70" y="615" class="small">3 · QUESTION ROUTING &amp; RETRIEVAL</text>
  <rect x="70" y="645" width="390" height="135" class="box"/>
  <text x="98" y="690" class="title">Natural-language question</text>
  <text x="98" y="723" class="body">Question + selected catalogue ID</text>
  <text x="98" y="750" class="body">Example: “How many contain cotton?”</text>
  <rect x="555" y="645" width="440" height="135" class="box"/>
  <text x="583" y="690" class="title">Direct resolvers + query router</text>
  <text x="583" y="723" class="body">Resolve supported deterministic questions</text>
  <text x="583" y="750" class="body">Route to structured · hybrid · semantic</text>
  <path d="M460 712 H545" class="arrow"/>

  <!-- retrieval strategies -->
  <rect x="70" y="850" width="440" height="150" class="box2"/>
  <text x="98" y="892" class="title">Structured retrieval</text>
  <text x="98" y="926" class="body">LLM-assisted query interpretation</text>
  <text x="98" y="953" class="body">Validate fields / operators / filters</text>
  <text x="98" y="980" class="body">Execute exact operations in DuckDB</text>

  <rect x="580" y="850" width="440" height="150" class="box2"/>
  <text x="608" y="892" class="title">Hybrid retrieval</text>
  <text x="608" y="926" class="body">Extract and validate explicit conditions</text>
  <text x="608" y="953" class="body">Combine catalogue filters + retrieval</text>
  <text x="608" y="980" class="body">Ground returned products in catalogue data</text>

  <rect x="1090" y="850" width="440" height="150" class="box2"/>
  <text x="1118" y="892" class="title">Semantic retrieval</text>
  <text x="1118" y="926" class="body">Embed the user's question</text>
  <text x="1118" y="953" class="body">Retrieve ranked candidates from FAISS</text>
  <text x="1118" y="980" class="body">Enrich product evidence from DuckDB</text>

  <path d="M775 780 V815 H290 V840" class="arrow"/>
  <path d="M775 780 V840" class="arrow"/>
  <path d="M775 780 V815 H1310 V840" class="arrow"/>

  <!-- 4. ANSWER -->
  <text x="70" y="1060" class="small">4 · GROUNDED ANSWER &amp; USER EXPERIENCE</text>
  <rect x="250" y="1090" width="570" height="120" rx="18" fill="url(#teal)" filter="url(#shadow)"/>
  <text x="282" y="1135" class="title">Answer generation + product evidence</text>
  <text x="282" y="1168" class="body">Verified counts where supported; candidate lists otherwise</text>
  <rect x="950" y="1090" width="580" height="120" rx="18" fill="url(#blue)" filter="url(#shadow)"/>
  <text x="982" y="1135" class="title">Original three-panel Gradio dashboard</text>
  <text x="982" y="1168" class="body">Left: upload · Centre: five dimensions · Right: AI assistant</text>
  <path d="M290 1000 V1035 M800 1000 V1035 M1310 1000 V1035" stroke="#91a7ca" stroke-width="2.4" fill="none"/>
  <path d="M290 1035 H800 H1310" stroke="#91a7ca" stroke-width="2.4" fill="none"/>
  <path d="M535 1035 V1078" class="arrow"/>
  <path d="M820 1150 H940" class="arrow"/>
  <text x="70" y="1235" class="note">Design principle: DuckDB is the source of truth for supported exact calculations; semantic similarity alone is not an exact count.</text>
</svg>
