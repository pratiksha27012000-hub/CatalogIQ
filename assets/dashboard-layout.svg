<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="700" viewBox="0 0 1500 700" role="img" aria-labelledby="t d">
<title id="t">CatalogIQ three-panel interface layout</title><desc id="d">Schematic of the original CatalogIQ dashboard with upload controls on the left, five canonical catalogue dimensions in the centre and the AI assistant on the right.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#08111f"/><stop offset="1" stop-color="#111d33"/></linearGradient><linearGradient id="a" x2="1" y2="1"><stop stop-color="#1d5fcb"/><stop offset="1" stop-color="#5046bc"/></linearGradient><style>.h{font:700 32px Arial,sans-serif;fill:#f0f5ff}.s{font:16px Arial,sans-serif;fill:#9fb1cf}.th{font:700 20px Arial,sans-serif;fill:#eef4ff}.b{font:15px Arial,sans-serif;fill:#b7c8df}.box{fill:#111f35;stroke:#304767;stroke-width:2}.card{fill:#172a46;stroke:#344f75;stroke-width:1.5}.label{font:700 14px Arial,sans-serif;fill:#74d8e5;letter-spacing:1px}</style></defs>
<rect width="1500" height="700" rx="22" fill="url(#bg)"/><text x="50" y="65" class="h">CatalogIQ dashboard · interface layout</text><text x="50" y="95" class="s">A three-panel workflow for catalogue setup, catalogue intelligence and conversational analysis</text>
<rect x="45" y="130" width="350" height="510" rx="18" class="box"/><text x="75" y="175" class="label">01 · LEFT PANEL</text><text x="75" y="215" class="th">Upload catalogue</text><rect x="75" y="245" width="290" height="90" rx="13" class="card" stroke-dasharray="7 5"/><text x="105" y="285" class="b">Drop CSV / Excel / JSON</text><text x="105" y="310" class="s">or browse files</text><text x="75" y="375" class="th">Map source columns</text><g class="b"><text x="85" y="415">Product name</text><text x="85" y="455">Description</text><text x="85" y="495">Selling price</text><text x="85" y="535">Cost price</text><text x="85" y="575">Inventory quantity</text></g><path d="M235 398h120M235 438h120M235 478h120M235 518h120M235 558h120" stroke="#405b80" stroke-width="2"/>
<rect x="425" y="130" width="650" height="510" rx="18" class="box"/><text x="455" y="175" class="label">02 · CENTRE PANEL</text><text x="455" y="215" class="th">Five canonical dimensions</text><text x="455" y="245" class="s">A consistent data foundation across different product categories</text>
<g><rect x="455" y="285" width="275" height="125" rx="14" class="card"/><rect x="755" y="285" width="275" height="125" rx="14" class="card"/><rect x="455" y="430" width="275" height="125" rx="14" class="card"/><rect x="755" y="430" width="275" height="125" rx="14" class="card"/><rect x="605" y="575" width="275" height="50" rx="12" fill="url(#a)"/></g>
<g class="th"><text x="480" y="330">Product title</text><text x="780" y="330">Description</text><text x="480" y="475">Selling price</text><text x="780" y="475">Cost price</text><text x="635" y="607" font-size="17">Inventory quantity</text></g><g class="s"><text x="480" y="365">Name / product identity</text><text x="780" y="365">Details and source context</text><text x="480" y="510">Customer-facing price</text><text x="780" y="510">Unit cost</text></g>
<rect x="1105" y="130" width="350" height="510" rx="18" class="box"/><text x="1135" y="175" class="label">03 · RIGHT PANEL</text><text x="1135" y="215" class="th">CatalogIQ Assistant</text><text x="1135" y="245" class="s">Ask questions about your catalogue</text><rect x="1135" y="280" width="285" height="72" rx="13" class="card"/><text x="1155" y="310" class="b">How many products</text><text x="1155" y="333" class="b">contain cotton?</text><rect x="1150" y="375" width="180" height="55" rx="13" fill="#17365b"/><text x="1175" y="408" class="th">8 products</text><rect x="1135" y="455" width="285" height="90" rx="13" class="card"/><text x="1155" y="490" class="b">Find products with</text><text x="1155" y="515" class="b">recycled polyester.</text><rect x="1150" y="560" width="250" height="55" rx="13" fill="#17365b"/><text x="1168" y="594" class="b">FlexFit Sports Bra</text>
<text x="50" y="675" class="s">Schematic for orientation only; see the real assistant capture and full dashboard recording for the implemented UI.</text>
</svg>
